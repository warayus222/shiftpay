<style>
/* Layout concept: a roster-paper feel. Navy header band with the month switcher,
   four tabs, then white "sheet" cards with ruled rows. Shift chips echo the
   ช / บ / ด codes used on the ward roster. */
:root {
  --bg: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink2: #52514e;
  --muted: #6b6a65;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --brand: #0b4f52;
  --brand-ink: #f2fbfa;
  --brand-dim: #a5d3d0;
  --accent: #0f7f80;
  --accent-strong: #0b6b6d;
  --on-accent: #ffffff;
  --field: #f3f2ee;
  --weekend: #b3261e;
  --danger: #b3261e;
  --good: #006300;
  --c-m: #fff0c2;
  --c-a: #fddcc8;
  --c-n: #dcd9f5;
  --c-d: #d8efe3;
  --c-ot: #fbd3de;
  --s1: #0f8a8a; --s2: #d9466f; --s3: #eda100; --s4: #6250d6; --s5: #eb6834; --s6: #008300; --s7: #2a78d6;
  --font: "IBM Plex Sans Thai", "Noto Sans Thai", "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #a09e96;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --brand: #062a2c; --brand-ink: #e9f7f6; --brand-dim: #86bfbc;
    --accent: #2bb3b0; --accent-strong: #2bb3b0; --on-accent: #04191a;
    --field: #232322; --weekend: #f2877f; --danger: #f2877f; --good: #0ca30c;
    --c-m: #4a3b10; --c-a: #4d2a1a; --c-n: #2b2a5c; --c-d: #1f4033; --c-ot: #5a2236;
    --s1: #2bb3b0; --s2: #e8678a; --s3: #c98500; --s4: #9085e9; --s5: #d95926; --s6: #008300; --s7: #3987e5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #a09e96;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --brand: #062a2c; --brand-ink: #e9f7f6; --brand-dim: #86bfbc;
  --accent: #2bb3b0; --accent-strong: #2bb3b0; --on-accent: #04191a;
  --field: #232322; --weekend: #f2877f; --danger: #f2877f; --good: #0ca30c;
  --c-m: #4a3b10; --c-a: #4d2a1a; --c-n: #2b2a5c; --c-d: #1f4033; --c-ot: #5a2236;
  --s1: #2bb3b0; --s2: #e8678a; --s3: #c98500; --s4: #9085e9; --s5: #d95926; --s6: #008300; --s7: #3987e5;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }

/* header band */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--brand); color: var(--brand-ink); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px 0; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-size: 18px; font-weight: 700; letter-spacing: 0.01em; }
.brand span { font-size: 12.5px; color: var(--brand-dim); }
.sync { font-size: 12px; color: var(--brand-dim); display: flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-dim); display: inline-block; }
.sync.ok i { background: #55c98a; }
.sync.off i { background: #e6a23c; }
.tools { display: flex; align-items: center; gap: 12px; }
.themebtn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.12); color: var(--brand-ink); border: 1px solid rgba(255,255,255,0.24); border-radius: 999px; padding: 5px 12px 5px 9px; font-size: 12.5px; font-weight: 500; line-height: 1.4; }
.themebtn:hover { background: rgba(255,255,255,0.22); }
.themebtn:focus-visible { outline-color: var(--brand-ink); }
.themebtn svg { width: 16px; height: 16px; flex: none; }
@media (max-width: 480px) { .themebtn span { display: none; } .themebtn { padding: 6px 8px; } .sync { font-size: 11.5px; } }
.bk { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding-top: 8px; }
.tabs button { background: transparent; border: 0; color: var(--brand-dim); padding: 10px 4px 11px; font-weight: 500; font-size: 14.5px; border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--brand-ink); border-bottom-color: var(--brand-ink); font-weight: 600; }
.tabs button:focus-visible { outline-color: var(--brand-ink); outline-offset: -3px; }

main { padding-block: 18px 56px; display: block; }
.stack { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 0; }
.card > h2, .card-h { font-size: 15px; font-weight: 600; margin: 0 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card-h small, .sub { font-size: 12.5px; color: var(--ink2); font-weight: 400; }
.notice { border: 1px dashed var(--axis); border-radius: 10px; padding: 14px 16px; color: var(--ink2); background: var(--surface); }
.notice b { color: var(--ink); }
.notice.warn { border-color: #e6a23c; }
.link { background: none; border: 0; color: var(--accent); text-decoration: underline; padding: 0; }

/* toolbar */
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar h1 { font-size: 20px; font-weight: 700; margin: 0 6px; min-width: 9.5em; text-align: center; }
.btn { background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: 6px 12px; min-height: 36px; font-weight: 500; }
.btn:hover { border-color: var(--ink2); }
.btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }
.btn.icon { width: 38px; padding: 0; font-size: 18px; line-height: 1; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.spacer { flex: 1; }

/* hero */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 8px 24px; align-items: end; }
.hero .lab { font-size: 13px; color: var(--ink2); }
.hero .big { font-size: clamp(36px, 9vw, 54px); font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
.hero .big small { font-size: 0.45em; font-weight: 500; color: var(--ink2); margin-left: 4px; }
.hero .meta { color: var(--ink2); font-size: 14px; }
.split { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.split > div { background: var(--field); border-radius: 8px; padding: 6px 12px; min-width: 150px; }
.split span { display: block; font-size: 12px; color: var(--ink2); }
.split b { font-size: 16px; font-weight: 600; }
.wdp { border: 1px solid var(--grid); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
.wdp .ph { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; margin-bottom: 4px; }
.wdp .ph input { width: auto; }
.wdp .ph .sp { flex: 1; }
.wdp .cur { font-size: 11.5px; font-weight: 600; background: var(--accent-strong); color: var(--on-accent); border-radius: 999px; padding: 1px 8px; }
.rrow.wdr { grid-template-columns: minmax(120px, 1fr) 130px; }
.wdp .sub { font-size: 12.5px; font-weight: 600; color: var(--ink2); margin-top: 10px; }
.rrow.sal span { font-weight: 600; }
.rrow.otr { grid-template-columns: minmax(120px, 1.4fr) 120px 110px 38px; }
.delta { text-align: right; font-size: 13px; color: var(--ink2); }
.delta b { display: block; font-size: 16px; color: var(--ink); }
.delta .up { color: var(--good); }
@media (max-width: 560px) { .hero { grid-template-columns: 1fr; } .delta { text-align: left; } }

/* proportion bar + legend */
.pbar { display: flex; gap: 2px; height: 22px; border-radius: 6px; overflow: hidden; background: var(--field); }
.pbar span { display: block; min-width: 3px; }
.legend { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 24px; }
.legend li { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; font-size: 14px; }
.legend li.zero { color: var(--muted); }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; }
.legend .pc { color: var(--ink2); font-size: 12.5px; min-width: 3.2em; text-align: right; }
.inline-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink2); margin-top: 10px; }
.inline-legend span { display: inline-flex; align-items: center; gap: 6px; }
.inline-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* tables */
.scroll { overflow-x: auto; }
tr.dim td { color: var(--muted); }
table.sumt td:first-child { white-space: normal; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 600; font-size: 12.5px; color: var(--ink2); vertical-align: bottom; line-height: 1.3; }
.scroll td:first-child, .scroll th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.scroll tr.tot td:first-child { background: var(--field); }
.scroll tr.click:hover td:first-child { background: var(--field); }
tr.tot td { font-weight: 700; background: var(--field); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--field); }
tr.empty td { color: var(--muted); }
.tnote { font-size: 12.5px; color: var(--ink2); margin: 10px 0 0; }

/* chips */
.chip { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 12.5px; font-weight: 600; line-height: 1.5; background: var(--field); white-space: nowrap; }
.chip.m { background: var(--c-m); } .chip.a { background: var(--c-a); } .chip.n { background: var(--c-n); } .chip.d { background: var(--c-d); }
.chip.ot { background: var(--c-ot); }
.chip.off { background: transparent; color: var(--muted); font-weight: 500; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { text-align: center; font-size: 12.5px; color: var(--ink2); font-weight: 600; padding-bottom: 2px; }
.cal .dow.we { color: var(--weekend); }
.cal .blank { min-height: 1px; }
.cal button.cell { text-align: left; background: var(--bg); border: 1px solid var(--grid); border-radius: 6px; min-height: 76px; padding: 4px 5px; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; overflow: hidden; }
.cal button.cell:hover { border-color: var(--ink2); }
.cal button.cell.today { border: 2px solid var(--accent); padding: 3px 4px; }
.cal .dn { font-size: 12.5px; font-weight: 600; color: var(--ink2); }
.cal .dn.we { color: var(--weekend); }
.cal .amt { font-size: 11.5px; color: var(--ink2); margin-top: auto; }
.cal .chips { display: flex; flex-wrap: wrap; gap: 2px; }
.cal .chip { font-size: 11.5px; padding: 0 5px; }
@media (max-width: 560px) {
  .cal .amt, .cal .chip .u { display: none; }
  .cal button.cell { min-height: 62px; padding: 3px; }
  .cal button.cell.today { padding: 2px; }
  .cal { gap: 3px; }
  .cal .chip { font-size: 10px; padding: 0 3px; letter-spacing: -0.02em; }
  .toolbar h1 { flex: 1; min-width: 0; margin: 0; }
}

/* bar charts */
.chart { position: relative; display: grid; grid-template-columns: 44px 1fr; gap: 0 6px; }
.yax { position: relative; height: 170px; font-size: 11.5px; color: var(--muted); }
.yax span { position: absolute; right: 0; transform: translateY(50%); font-variant-numeric: tabular-nums; }
.plot { position: relative; height: 170px; border-bottom: 1px solid var(--axis); }
.plot .gl { position: absolute; left: 0; right: 0; height: 1px; background: var(--grid); }
.cols { position: absolute; inset: 0; display: grid; gap: 3px; align-items: end; }
.col { height: 100%; display: flex; flex-direction: column-reverse; align-items: center; justify-content: flex-start; background: transparent; border: 0; padding: 0; position: relative; }
.col .stackbar { width: 100%; max-width: 22px; display: flex; flex-direction: column-reverse; }
.col .seg { width: 100%; }
.col .seg + .seg { border-bottom: 2px solid var(--surface); }
.col:hover::before, .col:focus-visible::before { content: ""; position: absolute; inset: 0; background: var(--field); z-index: 0; border-radius: 3px; }
.col .stackbar { position: relative; z-index: 1; border-radius: 3px 3px 0 0; overflow: hidden; }
.xax { grid-column: 2; display: grid; gap: 3px; font-size: 11.5px; color: var(--muted); padding-top: 4px; text-align: center; font-variant-numeric: tabular-nums; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: 12.5px; line-height: 1.4; white-space: nowrap; max-width: 260px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
@media (max-width: 600px) { .xax span.minor { visibility: hidden; } }

/* log */
.extras { display: grid; gap: 8px; }
.exrow { display: grid; grid-template-columns: minmax(90px, 1fr) 90px 90px 110px; gap: 8px; align-items: center; }
.exrow .calc { color: var(--ink2); font-size: 13px; text-align: right; }
.exrow .amt { text-align: right; font-weight: 600; }
.exrow.o { grid-template-columns: minmax(90px, 1fr) 130px 38px; }
.exsum { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--grid); padding-top: 10px; font-weight: 600; }
input[type="text"], input[type="number"], select { background: var(--field); border: 1px solid var(--axis); border-radius: 7px; padding: 6px 8px; min-height: 36px; width: 100%; min-width: 0; }
input[type="number"] { font-variant-numeric: tabular-nums; }
input:disabled, select:disabled { opacity: .6; cursor: not-allowed; }
.rowhead, .row { display: grid; grid-template-columns: 112px 128px 200px 104px 96px 112px minmax(120px, 1fr); gap: 8px; align-items: center; padding: 6px 12px; }
.rowhead { font-size: 12.5px; font-weight: 600; color: var(--ink2); border-bottom: 1px solid var(--axis); padding-block: 8px; }
.rowhead .r, .row .r { text-align: right; }
.row { border-bottom: 1px solid var(--grid); }
.row.hl { background: var(--field); }
.row.we .dow { color: var(--weekend); }
.row .dcell { display: flex; align-items: center; gap: 6px; min-width: 0; }
.row .dnum { font-weight: 700; min-width: 1.6em; text-align: right; font-variant-numeric: tabular-nums; }
.row .dow { font-size: 13px; color: var(--ink2); min-width: 1.6em; }
.row .mini { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--axis); background: var(--surface); padding: 0; line-height: 1; font-size: 15px; }
.row .mini[hidden] { display: none; }
.row .pay, .row .tot { text-align: right; font-variant-numeric: tabular-nums; }
.row .tot { font-weight: 700; }
.row .pay.bad { color: var(--danger); font-weight: 600; }
.row select.sh[data-c="m"] { background: var(--c-m); } .row select.sh[data-c="a"] { background: var(--c-a); }
.row select.sh[data-c="n"] { background: var(--c-n); } .row select.sh[data-c="d"] { background: var(--c-d); }
.row select.dt[data-v="OT"] { background: var(--c-ot); font-weight: 600; }
.row select.dt[data-v="OFF"] { color: var(--muted); }
.rows { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); overflow: hidden; }
@media (max-width: 820px) {
  .rowhead { display: none; }
  .row { grid-template-columns: 1fr 1fr; grid-template-areas: "date tot" "dt sh" "hrs note"; gap: 6px 8px; padding: 10px 12px; }
  .row .dcell { grid-area: date; } .row .tot { grid-area: tot; font-size: 16px; }
  .row .dt { grid-area: dt; } .row .sh { grid-area: sh; } .row .hrs { grid-area: hrs; } .row .note { grid-area: note; }
  .row .pay { display: none; }
  .exrow { grid-template-columns: 1fr 80px; }
  .exrow .calc { grid-column: 1; text-align: left; } .exrow .amt { grid-column: 2; }
  .exrow.o { grid-template-columns: 1fr 110px 38px; }
}

/* rates */
.rrow { display: grid; grid-template-columns: 120px minmax(120px, 1.4fr) 120px 110px 38px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--grid); }
.rrow.h { font-size: 12.5px; font-weight: 600; color: var(--ink2); border-bottom-color: var(--axis); }
.rrow.ref { grid-template-columns: minmax(120px, 1fr) 130px 38px; }
.field { display: grid; grid-template-columns: minmax(150px, 1fr) 130px; gap: 8px; align-items: center; padding: 6px 0; }
.field small { grid-column: 1 / -1; color: var(--ink2); font-size: 12.5px; }
@media (max-width: 700px) {
  .rrow { grid-template-columns: 1fr 1fr 38px; grid-template-areas: "d s s" "t r x"; padding: 10px 0; }
  .rrow.h { display: none; }
  .rrow > :nth-child(1) { grid-area: d; } .rrow > :nth-child(2) { grid-area: s; } .rrow > :nth-child(3) { grid-area: t; } .rrow > :nth-child(4) { grid-area: r; } .rrow > :nth-child(5) { grid-area: x; }
  .rrow.ref { grid-template-columns: 1fr 100px 38px; grid-template-areas: none; }
  .rrow.ref > * { grid-area: auto !important; justify-self: stretch !important; }
  .rrow.wdr { grid-template-columns: 1fr 120px; grid-template-areas: none; padding: 8px 0; }
  .rrow.wdr > * { grid-area: auto !important; }
  .rrow.otr { grid-template-columns: 1fr 110px 38px; grid-template-areas: "s s s" "t r x"; }
  .rrow.otr > :nth-child(1) { grid-area: s; } .rrow.otr > :nth-child(2) { grid-area: t; } .rrow.otr > :nth-child(3) { grid-area: r; } .rrow.otr > :nth-child(4) { grid-area: x; }
}

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 40; max-width: calc(100vw - 32px); }
.skel { height: 120px; border-radius: 10px; background: var(--field); }
@media (prefers-reduced-motion: no-preference) { .row.hl { transition: background .6s; } }
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b>ตารางเวร</b><span>ค่าเวรพยาบาล</span></div>
    <div class="tools">
      <div class="sync" id="sync"><i></i><span>กำลังเชื่อมต่อ</span></div>
      <button class="themebtn" id="theme" type="button"></button>
    </div>
  </div>
  <div class="wrap">
    <nav class="tabs" role="tablist" aria-label="เมนู" id="tabs"></nav>
  </div>
</header>
<main><div class="wrap" id="view"><div class="skel" aria-hidden="true"></div></div></main>
<div id="toast" hidden role="status"></div>

<script>
(function () {
'use strict';
